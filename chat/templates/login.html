{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — PixelPrompt</title>
  <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="auth-logo-dot"></span>
      <span class="auth-logo-name">PixelPrompt</span>
    </div>

    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Sign in to continue generating.</p>

    <form method="post">
      {% csrf_token %}
      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input class="auth-input" type="text" name="username" id="username" placeholder="Your username" required autofocus />
      </div>
      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" type="password" name="password" id="password" placeholder="••••••••" required />
      </div>
      {% if form.errors %}
      <p style="font-size:13px;color:#f87171;margin-bottom:12px;">Invalid username or password.</p>
      {% endif %}
      <button type="submit" class="btn-auth">Sign in</button>
    </form>

    <p class="auth-footer">No account? <a href="{% url 'register' %}">Create one</a></p>
  </div>
</div>
</body>
</html>
