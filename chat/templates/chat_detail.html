{% extends 'base.html' %}
{% block content %}
<div class="chat-detail">
    <h2>{{ chat.title }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Generate Image</button>
    </form>
    <div class="images">
        {% for image in images %}
        <div class="image">
            <img src="{% url 'image_file' image.id %}" alt="Generated Image">
            <p>Prompt: {{ image.prompt }}</p>
        </div>
        {% endfor %}
    </div>
    <a href="{% url 'dashboard' %}">Back to Chats</a>
</div>
{% endblock %}
